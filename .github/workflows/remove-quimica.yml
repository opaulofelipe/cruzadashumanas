name: Remover entradas de Química

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/remove-quimica.yml'

permissions:
  contents: write

jobs:
  remover-quimica:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Remover entradas de Química dos JSONs
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import json
          from pathlib import Path

          total = 0
          alterados = []

          for caminho in sorted(glob.glob('dados/*.json')):
              p = Path(caminho)
              with p.open('r', encoding='utf-8') as f:
                  dados = json.load(f)

              perguntas = dados.get('perguntas', [])
              novas = [
                  item for item in perguntas
                  if not (isinstance(item.get('id'), int) and 570 <= item['id'] <= 758)
              ]
              removidas = len(perguntas) - len(novas)

              if removidas:
                  dados['perguntas'] = novas
                  p.write_text(
                      json.dumps(dados, ensure_ascii=False, indent=2) + '\n',
                      encoding='utf-8'
                  )
                  alterados.append((caminho, removidas))
                  total += removidas

          if total != 189:
              raise SystemExit(f'Esperava remover 189 entradas de Química, mas removi {total}. Nenhuma alteração será enviada.')

          print('Arquivos alterados:')
          for caminho, quantidade in alterados:
              print(f'- {caminho}: {quantidade} entradas removidas')
          print(f'Total removido: {total}')
          PY

      - name: Validar os oito JSONs
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import json

          arquivos = sorted(glob.glob('dados/*.json'))
          if len(arquivos) != 8:
              raise SystemExit(f'Esperava 8 arquivos JSON em dados/, encontrei {len(arquivos)}.')

          for caminho in arquivos:
              with open(caminho, 'r', encoding='utf-8') as f:
                  dados = json.load(f)
              ids = [item.get('id') for item in dados.get('perguntas', [])]
              restantes = [i for i in ids if isinstance(i, int) and 570 <= i <= 758]
              if restantes:
                  raise SystemExit(f'{caminho} ainda contém IDs de Química: {restantes}')
              print(f'OK: {caminho}')
          PY

      - name: Salvar alterações
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/*.json
          git commit -m "Remove entradas de Química dos bancos de palavras"
          git push
